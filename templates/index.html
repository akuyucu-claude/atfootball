<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austrian Football Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <div>
        <h1>Austrian Football Hub</h1>
        <div class="subtitle">Austrian Bundesliga &middot; Teams, Players, Standings &amp; Matches</div>
    </div>
</header>

<nav>
    <button class="active" data-section="teams">Teams</button>
    <button data-section="players">Players</button>
    <button data-section="standings">Standings</button>
    <button data-section="matches">Matches</button>
</nav>

<main>
    <!-- Teams Section -->
    <div id="teams" class="section active">
        <div class="section-header">
            <h2>Teams</h2>
            <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-primary" onclick="showAddTeam()">+ Add Team</button>
                <button class="btn btn-primary" id="seed-btn" onclick="seedDatabase()">Seed Database</button>
            </div>
        </div>
        <div id="teams-grid" class="teams-grid"></div>
    </div>

    <!-- Players Section -->
    <div id="players" class="section">
        <div class="section-header">
            <h2>Players</h2>
            <button class="btn btn-primary" onclick="showAddPlayer()">+ Add Player</button>
        </div>
        <div class="filters">
            <select id="player-team-filter" onchange="loadPlayers()">
                <option value="">All Teams</option>
            </select>
            <select id="player-pos-filter" onchange="loadPlayers()">
                <option value="">All Positions</option>
                <option value="Goalkeeper">Goalkeeper</option>
                <option value="Defender">Defender</option>
                <option value="Midfielder">Midfielder</option>
                <option value="Forward">Forward</option>
            </select>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Team</th>
                        <th>Nationality</th>
                        <th>Height</th>
                    </tr>
                </thead>
                <tbody id="players-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- Standings Section -->
    <div id="standings" class="section">
        <div class="section-header">
            <h2>Bundesliga Standings</h2>
            <span style="color:var(--text-muted)">Season 2025-26</span>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>Goals</th>
                        <th>GD</th>
                        <th>Pts</th>
                    </tr>
                </thead>
                <tbody id="standings-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- Matches Section -->
    <div id="matches" class="section">
        <div class="section-header">
            <h2>Matches</h2>
        </div>
        <div id="matches-list" class="matches-list"></div>
    </div>
</main>

<!-- Add Team Modal -->
<div class="modal-overlay" id="add-team-modal">
    <div class="modal">
        <h3>Add Team</h3>
        <form onsubmit="submitTeam(event)">
            <div class="form-group">
                <label>Team Name *</label>
                <input name="name" required>
            </div>
            <div class="form-group">
                <label>Short Name</label>
                <input name="short_name" maxlength="10">
            </div>
            <div class="form-group">
                <label>City</label>
                <input name="city">
            </div>
            <div class="form-group">
                <label>Stadium</label>
                <input name="stadium">
            </div>
            <div class="form-group">
                <label>Founded Year</label>
                <input name="founded_year" type="number" min="1800" max="2030">
            </div>
            <div class="form-group">
                <label>League</label>
                <input name="league" value="Bundesliga">
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="closeModal('add-team-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Team</button>
            </div>
        </form>
    </div>
</div>

<!-- Add Player Modal -->
<div class="modal-overlay" id="add-player-modal">
    <div class="modal">
        <h3>Add Player</h3>
        <form onsubmit="submitPlayer(event)">
            <div class="form-group">
                <label>First Name *</label>
                <input name="first_name" required>
            </div>
            <div class="form-group">
                <label>Last Name *</label>
                <input name="last_name" required>
            </div>
            <div class="form-group">
                <label>Team</label>
                <select name="team_id" id="player-team-id">
                    <option value="">-- Select Team --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Position</label>
                <select name="position">
                    <option value="">-- Select --</option>
                    <option value="Goalkeeper">Goalkeeper</option>
                    <option value="Defender">Defender</option>
                    <option value="Midfielder">Midfielder</option>
                    <option value="Forward">Forward</option>
                </select>
            </div>
            <div class="form-group">
                <label>Jersey Number</label>
                <input name="jersey_number" type="number" min="1" max="99">
            </div>
            <div class="form-group">
                <label>Nationality</label>
                <input name="nationality">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input name="date_of_birth" type="date">
            </div>
            <div class="form-group">
                <label>Height (cm)</label>
                <input name="height_cm" type="number" min="140" max="220">
            </div>
            <div class="form-group">
                <label>Preferred Foot</label>
                <select name="preferred_foot">
                    <option value="">-- Select --</option>
                    <option value="Right">Right</option>
                    <option value="Left">Left</option>
                    <option value="Both">Both</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="closeModal('add-player-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Player</button>
            </div>
        </form>
    </div>
</div>

<!-- Team Detail Modal -->
<div class="modal-overlay" id="team-detail-modal" onclick="if(event.target===this)closeModal('team-detail-modal')">
    <div class="modal" style="max-width:650px;">
        <div id="team-detail-content"></div>
        <div class="form-actions">
            <button class="btn" onclick="closeModal('team-detail-modal')">Close</button>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
